[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos-clean"
version = "0.1.1"
description = "量化行情自动体检与清洗：缺行、重复、OHLC 矛盾、停牌、异常跳变、拆股嫌疑。"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Zhuoming Wang" }]
keywords = ["quant", "data-quality", "data-cleaning", "anomaly-detection"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
kairos-clean = "kairos_clean.cli:main"

[tool.setuptools.packages.find]
include = ["kairos_clean*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]
